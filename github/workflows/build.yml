name: Build Nudge APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project
        run: |
          mkdir -p www
          cp index.html native.js www/
          echo '{"appId":"com.nudge.reminders","appName":"Nudge","webDir":"www"}' > capacitor.config.json
          cat > package.json <<'EOT'
          {"name":"nudge","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"6.2.2","@capacitor/cli":"6.2.2","@capacitor/core":"6.2.2","@capacitor/local-notifications":"6.1.3","@capacitor-community/speech-recognition":"6.0.1","@capacitor-community/text-to-speech":"5.1.0"}}
          EOT
      - run: npm install
      - run: npx cap add android
      - name: Add permissions
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms=''.join('    <uses-permission android:name="android.permission.%s"/>\n'%x for x in ['RECORD_AUDIO','POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','RECEIVE_BOOT_COMPLETED'])
          s=s.replace('</manifest>',perms+'</manifest>')
          open(p,'w').write(s)
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nudge-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
